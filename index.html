<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>For Barsa 💜</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Raleway:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#05010f;min-height:100vh;overflow:hidden;font-family:'Raleway',sans-serif;color:#fff;cursor:none}
    canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
    .cur{position:fixed;z-index:9999;width:16px;height:16px;border-radius:50%;background:rgba(255,50,200,.9);pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:screen}
    .scene{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:clamp(12px,2.5vh,24px)}
    .title{font-family:'Dancing Script',cursive;font-size:clamp(3rem,11vw,7rem);font-weight:700;color:#ff40e0;text-shadow:0 0 20px #ff40e0,0 0 60px rgba(255,64,224,.5),0 0 100px rgba(255,64,224,.3);opacity:0;animation:neonOn 2s ease forwards 1.8s}
    .sub{font-size:clamp(.7rem,2vw,.95rem);letter-spacing:.5em;text-transform:uppercase;color:rgba(255,150,255,.5);opacity:0;animation:fup 1s ease forwards 3.8s}
    .hw{opacity:0;animation:fup .8s ease forwards 4.6s}
    .hi{font-size:clamp(2rem,6vw,3.2rem);display:inline-block;animation:flicker 3s ease-in-out infinite 4.6s}
    .mw{max-width:min(560px,90vw);opacity:0;animation:fup 1.2s ease forwards 5.6s}
    .msg{font-size:clamp(.86rem,2.3vw,1.08rem);font-weight:300;line-height:2;color:rgba(255,220,255,.8)}
    .msg em{color:#ff80ff;font-style:italic}
    .msg strong{color:#ffb0ff}
    .btn{opacity:0;animation:fup .8s ease forwards 8.4s;background:transparent;border:1.5px solid rgba(255,64,224,.6);color:#fff;font-family:'Raleway',sans-serif;font-size:clamp(.78rem,2vw,.9rem);font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:13px 38px;border-radius:50px;cursor:pointer;transition:all .3s;text-shadow:0 0 8px rgba(255,64,224,.8)}
    .btn:hover{border-color:#ff40e0;box-shadow:0 0 20px rgba(255,64,224,.6),0 0 40px rgba(255,64,224,.3);transform:translateY(-2px)}
    .ds{position:fixed;bottom:16px;right:18px;font-size:.68rem;letter-spacing:.18em;color:rgba(255,150,255,.25);z-index:20;opacity:0;animation:fi 1s ease forwards 11s}
    @keyframes neonOn{0%{opacity:0;text-shadow:none}50%{opacity:.6;text-shadow:0 0 10px #ff40e0}100%{opacity:1;text-shadow:0 0 20px #ff40e0,0 0 60px rgba(255,64,224,.5),0 0 100px rgba(255,64,224,.3)}}
    @keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fi{to{opacity:1}}
    @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
  </style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="cur" id="cur"></div>
<div class="scene">
  <div class="title">Barsa</div>
  <div class="sub">you make me glow</div>
  <div class="hw"><span class="hi">💜</span></div>
  <div class="mw"><p class="msg">
    In a city of a million lights,<br>
    <em>you are the neon sign I keep looking for.</em><br><br>
    Bright, bold, impossible to walk past.<br>
    You make everywhere you go<br>
    <strong>feel like the place to be</strong> —<br>
    and I want to be wherever you are,<br>
    <em>Barsa.</em>
  </p></div>
  <button class="btn" id="btn" onclick="sendLove()">💜 Light Me Up 💜</button>
</div>
<div class="ds">November 06 · 2026</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
const sparks=[];
class Spark{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*3;this.vy=(Math.random()-.5)*3;this.life=Math.random()*.8+.2;this.decay=Math.random()*.008+.004;this.r=Math.random()*2+.5;const hues=['255,40,224','200,40,255','255,100,255','100,200,255'];this.col=hues[Math.floor(Math.random()*hues.length)]}update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.97;this.vy*=.97;this.life-=this.decay;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(${this.col},${this.life})`;ctx.fill();const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*6);g.addColorStop(0,`rgba(${this.col},${this.life*.3})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.arc(this.x,this.y,this.r*6,0,Math.PI*2);ctx.fillStyle=g;ctx.fill()}}
for(let i=0;i<200;i++)sparks.push(new Spark());
function loop(){ctx.clearRect(0,0,W,H);sparks.forEach((s,i)=>{s.update();s.draw();if(s.life<=0)sparks[i]=new Spark()});requestAnimationFrame(loop)}
loop();
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
function sendLove(){const btn=document.getElementById('btn');btn.textContent='💜 You Are My Glow 💜';setTimeout(()=>btn.textContent='💜 Light Me Up 💜',3000)}
window.addEventListener('resize',()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight});
</script>
</body>
</html>
